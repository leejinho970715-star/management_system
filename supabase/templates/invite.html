<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="margin:0;padding:24px 16px;background:#f3f7f6;color:#193b37;font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:16px;line-height:1.7;">
  <table role="presentation" style="width:100%;max-width:560px;margin:0 auto;border-collapse:collapse;background:#ffffff;border:1px solid #dce8e4;border-radius:12px;">
    <tr><td style="padding:32px;">
      <p style="margin:0 0 20px;color:#0D9488;font-size:20px;font-weight:700;">일심도림</p>
      <h1 style="margin:0 0 16px;font-size:24px;line-height:1.4;">신앙관리 계정 초대</h1>
      <p style="margin:0 0 24px;">관리자가 신도림지역 신앙관리 시스템에 초대했습니다. 아래 버튼을 눌러 초대를 수락하고 본인 비밀번호를 설정해주세요.</p>
      <p style="margin:0 0 24px;"><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 24px;border-radius:8px;background:#0D9488;color:#ffffff;text-decoration:none;font-size:16px;font-weight:700;">초대 수락 및 비밀번호 설정</a></p>
      <p style="margin:0 0 12px;">비밀번호는 12자 이상으로 설정해주세요. 로그인 후 사용할 수 있는 메뉴는 계정에 부여된 역할과 소속에 따라 달라집니다.</p>
      <p style="margin:24px 0 0;padding-top:20px;border-top:1px solid #dce8e4;color:#61756d;">이 메일을 예상하지 못했다면 링크를 누르지 말고 관리자에게 문의해주세요. 초대 링크를 다른 사람에게 전달하지 마세요.</p>
    </td></tr>
  </table>
</body>
</html>
